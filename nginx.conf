server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Server-Sent Events (/api/v1/service/stream). Without these, nginx holds
        # each event in its buffer until the buffer fills, so the live payload
        # viewer looks frozen for minutes at a time. The node only publishes once
        # a minute, so the read timeout has to outlast the quiet stretches — the
        # backend also sends a keepalive comment every 20s.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
